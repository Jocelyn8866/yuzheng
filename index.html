<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>昱錚企業開業待辦</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ECEAE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0A09" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="昱錚待辦">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&amp;display=swap">
<style>
:root{
  --bg:#ECEAE6; --surface:rgba(255,255,255,.72); --fg:#33312E; --muted:#7D7A75; --line:rgba(80,72,64,.16); --line-strong:rgba(80,72,64,.3);
  --seal:#A35F5B; --seal-soft:rgba(196,140,134,.22); --ok:#56705A; --ok-soft:rgba(141,166,143,.24); --okfill:#8DA68F; --hint:rgba(120,112,104,.12);
  --warn:#8E6A3E; --warn-soft:rgba(201,170,125,.26); --net:#61758F; --net-soft:rgba(107,127,153,.18); --on-accent:#FFFFFF;
  --glass:rgba(255,253,250,.5); --glass-strong:rgba(255,253,250,.7); --glass-edge:rgba(255,255,255,.7); --glass-shadow:0 10px 30px rgba(70,60,50,.10),0 1px 2px rgba(70,60,50,.06);
  --blob1:#D3DBE4; --blob2:#E7D6D2; --blob3:#D5E0D2; --blob4:#E4DCCB;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",Roboto,"Microsoft JhengHei","Helvetica Neue",sans-serif;
  --f-mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
:root[data-eff="dark"]{
  --bg:#0A0A09; --surface:rgba(56,53,50,.5); --fg:#EDEAE5; --muted:#A8A39C; --line:rgba(255,248,240,.12); --line-strong:rgba(255,248,240,.26);
  --seal:#D9A09B; --seal-soft:rgba(210,154,150,.18); --ok:#A9C2AB; --ok-soft:rgba(140,168,143,.2); --okfill:#8FAA92; --hint:rgba(160,150,140,.2);
  --warn:#D6B58A; --warn-soft:rgba(207,174,131,.18); --net:#9FB1C8; --net-soft:rgba(147,166,191,.2); --on-accent:#1E1D1B;
  --glass:rgba(40,38,36,.5); --glass-strong:rgba(52,49,46,.66); --glass-edge:rgba(255,248,240,.1); --glass-shadow:0 10px 30px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.4);
  --blob1:#1A2029; --blob2:#271D1D; --blob3:#1A221C; --blob4:#26221A;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-eff]){
  --bg:#0A0A09; --surface:rgba(56,53,50,.5); --fg:#EDEAE5; --muted:#A8A39C; --line:rgba(255,248,240,.12); --line-strong:rgba(255,248,240,.26);
  --seal:#D9A09B; --seal-soft:rgba(210,154,150,.18); --ok:#A9C2AB; --ok-soft:rgba(140,168,143,.2); --okfill:#8FAA92; --hint:rgba(160,150,140,.2);
  --warn:#D6B58A; --warn-soft:rgba(207,174,131,.18); --net:#9FB1C8; --net-soft:rgba(147,166,191,.2); --on-accent:#1E1D1B;
  --glass:rgba(40,38,36,.5); --glass-strong:rgba(52,49,46,.66); --glass-edge:rgba(255,248,240,.1); --glass-shadow:0 10px 30px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.4);
  --blob1:#1A2029; --blob2:#271D1D; --blob3:#1A221C; --blob4:#26221A;
  color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.7;padding:20px 16px 48px}
.wrap{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
header{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:12.5px;letter-spacing:.1em;color:var(--muted)}
h1{font-size:27px;font-weight:900;margin:0;line-height:1.3;text-wrap:balance}
.meta{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.meta span{font-family:var(--f-mono)}
.meta em{font-style:normal}
.alert{background:var(--seal-soft);border:1px solid var(--seal);border-radius:10px;padding:14px 16px;display:flex;gap:14px;align-items:center}
.alert .num{font-family:var(--f-mono);font-size:32px;color:var(--seal);line-height:1;min-width:2ch;text-align:center}
.alert .num small{display:block;font-size:12px;font-family:var(--f-body);margin-top:4px}
.alert p{margin:0;font-size:15px}
.progress{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px 10px;font-size:14px;color:var(--muted)}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.progress .n{font-family:var(--f-mono);text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12.5px;color:var(--muted);align-items:center}
section{display:flex;flex-direction:column;gap:10px}
h2{font-size:18px;margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 span{font-size:12.5px;font-weight:500;color:var(--muted);font-family:var(--f-mono)}
.sub{margin:-2px 0 0;font-size:14px;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.task{display:grid;grid-template-columns:24px 56px 1fr;gap:12px;padding:15px 14px;border-top:1px solid var(--line);cursor:pointer;align-items:start}
.task:first-child{border-top:0}
.task.prep{grid-template-columns:24px 1fr;padding:12px 14px}
.task input{width:22px;height:22px;margin:3px 0 0;accent-color:var(--ok)}
.date{font-family:var(--f-mono);font-size:13.5px;color:var(--muted);padding-top:2px;line-height:1.35}
.date b{display:block;font-weight:500;color:var(--fg);font-size:15px}
.body{min-width:0;display:flex;flex-direction:column;gap:5px}
.body strong{font-weight:700;font-size:16px}
.body p{margin:0;color:var(--muted);font-size:14.5px}
.body p.need{color:var(--fg);font-size:14px}
.body p.need b{color:var(--muted);font-weight:500}
.body ol{margin:2px 0 0;padding-left:1.3em;color:var(--muted);font-size:14.5px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:12px;padding:1px 9px;border-radius:99px;background:var(--hint);color:var(--muted);white-space:nowrap}
.tag.law{background:var(--seal-soft);color:var(--seal)}
.tag.net{background:var(--net-soft);color:var(--net)}
.tag.desk{background:var(--hint);color:var(--fg)}
.tag.self{background:var(--ok-soft);color:var(--ok)}
.tag.uncle{background:var(--warn-soft);color:var(--warn)}
.task:has(input:checked) strong{text-decoration:line-through;color:var(--muted)}
.task:has(input:checked){background:var(--ok-soft)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.kv{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-top:1px solid var(--line);min-width:0}
.kv:nth-child(-n+2){border-top:0}
.kv:nth-child(even){border-left:1px solid var(--line)}
.kv span{font-size:12.5px;color:var(--muted)}
.kv b{font-weight:500;font-size:15px}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tbl table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:380px}
.tbl th{font-size:12.5px;font-weight:500;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);white-space:nowrap}
.tbl tbody tr:first-child td{border-top:0}
.tbl tr.me td{background:var(--ok-soft)}
.tbl .r{text-align:right;font-family:var(--f-mono)}
.done-row{display:grid;grid-template-columns:24px 56px 1fr;gap:12px;padding:15px 14px;background:var(--ok-soft)}
.done-row .tick{color:var(--ok);font-weight:700;font-size:17px;line-height:1.5;text-align:center}
.done-row strong{font-weight:700;font-size:16px}
.done-row + .task{border-top:1px solid var(--line)}
.note{font-size:14px;color:var(--muted);background:var(--hint);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.note p{margin:0}
.note b{color:var(--fg)}
.contacts{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14.5px;padding:14px}
.contacts span:nth-child(even){font-family:var(--f-mono);user-select:all;text-align:right}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-state="on"] i{background:var(--ok)}
.sync[data-state="off"] i{background:var(--warn)}
.who{font-size:12.5px;color:var(--ok);margin-top:2px}
.gate{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;max-width:420px}
.gate{width:100%;margin:8vh auto 0}
.gate h2{justify-content:center;text-align:center}
body.locked header{align-items:center;text-align:center}
body.locked .meta{justify-content:center}
.gate label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.gate input,.gate select{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.gate button{font:inherit;font-size:16px;font-weight:700;padding:11px 14px;border:0;border-radius:8px;background:var(--fg);color:var(--bg);cursor:pointer}
.gate button:disabled{opacity:.6;cursor:wait}
.gate .err{color:var(--seal);font-size:14px;min-height:1.2em;margin:0}
.who-bar{font-size:13px;color:var(--muted)}
.who-bar button{font:inherit;font-size:13px;background:none;border:0;color:var(--net);cursor:pointer;padding:0;text-decoration:underline}
.gantt-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding-bottom:12px}
.gantt{min-width:640px;padding:12px 14px 4px}
.g-head,.g-row{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:10px}
.g-row{min-height:30px;border-top:1px solid var(--line)}
.g-label{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-row.done .g-label{color:var(--muted);text-decoration:line-through}
.g-track{position:relative;height:30px}
.g-axis{height:22px}
.g-tick{position:absolute;top:2px;transform:translateX(-50%);font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.g-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.g-bar{position:absolute;top:9px;height:12px;border-radius:6px;background:var(--net);min-width:9px}
.g-bar.wait{background:var(--net-soft);border:1.5px dashed var(--net)}
.g-row.done .g-bar{background:var(--ok)}
.g-row.done .g-bar.wait{background:var(--ok-soft);border-color:var(--ok)}
.g-dl{position:absolute;top:10px;width:10px;height:10px;background:var(--seal);transform:translateX(-50%) rotate(45deg)}
.g-now{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--seal);opacity:.5}
.g-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);padding:6px 14px 0}
.g-legend span{display:inline-flex;align-items:center;gap:6px}
.k{display:inline-block;width:16px;height:9px;border-radius:5px}
.k-plan{background:var(--net)}.k-wait{background:var(--net-soft);border:1.5px dashed var(--net)}.k-done{background:var(--ok)}
.k-dl{width:9px;height:9px;border-radius:0;background:var(--seal);transform:rotate(45deg)}
.k-now{width:2px;height:12px;border-radius:0;background:var(--seal);opacity:.55}
.no{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;margin-right:8px;border-radius:6px;background:var(--fg);color:var(--bg);font-family:var(--f-mono);font-size:12.5px;font-weight:500;vertical-align:2px;text-decoration:none}
.no.sm{min-width:20px;height:20px;margin:0 2px;font-size:12px;vertical-align:1px}
.task:has(input:checked) .no{opacity:.5}
.task{cursor:default}
.ttl{cursor:pointer}
.ttl strong{font-weight:700;font-size:16px}
.body a{color:var(--net);text-decoration:underline;text-underline-offset:2px;word-break:break-all}
.flow-wrap{background:var(--hint);border-radius:8px;padding:10px 12px;margin-top:4px;display:flex;flex-direction:column;gap:8px}
.flow-title{font-size:12px;color:var(--muted);letter-spacing:.04em}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px}
.flow .lane-l{font-size:12px;font-weight:700;color:var(--fg);min-width:3.2em}
.flow .st{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;line-height:1.45;color:var(--fg)}
.flow .st b{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted)}
.flow .st.end{border-color:var(--ok);color:var(--ok)}
.flow .ar{color:var(--muted);font-size:13px}
.task:has(input:checked) .flow .st{opacity:.6}
details.mat summary{list-style:none;display:flex;align-items:center;gap:0;cursor:pointer;flex-wrap:wrap}
details.mat summary::-webkit-details-marker{display:none}
details.mat summary strong{font-weight:700;font-size:16px}
details.mat .more{margin-left:auto;font-size:12px;color:var(--net);border:1px solid var(--net);border-radius:99px;padding:0 10px;white-space:nowrap}
details.mat .more::after{content:" ▾"}
details.mat[open] .more::after{content:" ▴"}
details.mat summary:focus-visible{outline:2px solid var(--net);outline-offset:3px;border-radius:6px}
.det{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:10px 0 2px;padding:10px 12px;background:var(--hint);border-radius:8px;font-size:14px}
.det dt{color:var(--muted);white-space:nowrap}
.det dd{margin:0;color:var(--fg);min-width:0}
.task.prep:has(input:checked) summary strong{text-decoration:line-through;color:var(--muted)}
.links{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-top:1px solid var(--line);font-size:14.5px}
.links a,.contacts a{color:var(--net);text-decoration:underline;text-underline-offset:2px}
.info{padding:14px;display:flex;flex-direction:column;gap:12px}
.info-status{display:flex;flex-wrap:wrap;gap:6px}
.info-chip{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--hint);color:var(--muted)}
.info-chip.ok{background:var(--ok-soft);color:var(--ok)}
.info-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.info-form label{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted);min-width:0}
.info-form input,.info-form select{font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}
.info-form button{font:inherit;font-size:16px;font-weight:700;padding:10px 14px;border:0;border-radius:8px;background:var(--fg);color:var(--bg);cursor:pointer}
.info-form button:disabled{opacity:.6;cursor:wait}
.info-msg{grid-column:1/-1;margin:0;font-size:14px;color:var(--ok);min-height:1.2em}
.info-msg.err{color:var(--seal)}
.sub b{color:var(--fg);font-weight:500}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;overflow-x:auto;background:var(--bg);padding:8px 0;margin:0 0 20px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font:inherit;font-size:15px;font-weight:500;white-space:nowrap;padding:8px 14px;border:1px solid transparent;border-radius:8px;background:none;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tab:hover{color:var(--fg);background:var(--hint)}
.tab.on{background:var(--fg);color:var(--bg)}
.tab .cnt{font-family:var(--f-mono);font-size:11.5px;opacity:.8}
.tab:focus-visible{outline:2px solid var(--net);outline-offset:2px}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pager button{font:inherit;font-size:15px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.pager button.next{margin-left:auto;background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.info-tbl td{vertical-align:top}
.info-tbl .muted{color:var(--muted)}
.cp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cp .val{font-family:var(--f-mono);font-size:14px;user-select:all}
.val-sub{font-size:12px;color:var(--muted);margin-top:2px}
.mini{font:inherit;font-size:12px;padding:2px 9px;border-radius:6px;border:1px solid var(--net);background:none;color:var(--net);cursor:pointer}
.mini:active{background:var(--net-soft)}
.view-form{border-top:1px solid var(--line);padding-top:12px}
.info-form button.ghost{background:none;color:var(--fg);border:1px solid var(--line);font-weight:500}
.mbtn{border:0;cursor:pointer;line-height:1}
.mbtn:hover{filter:brightness(1.15)}
.mbtn.on{box-shadow:0 0 0 2px var(--net)}
.mat-pop{margin-top:2px;border:1px solid var(--net);border-radius:8px;padding:10px 12px;background:var(--surface)}
.mp-h{display:flex;align-items:center;gap:0;flex-wrap:wrap}
.mp-h strong{font-size:14.5px;color:var(--fg)}
.mp-st{margin-left:10px;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--hint);color:var(--muted)}
.mp-st.ok{background:var(--ok-soft);color:var(--ok)}
.mp-x{margin-left:auto;font:inherit;font-size:18px;line-height:1;background:none;border:0;color:var(--muted);cursor:pointer;padding:0 4px}
.mat-pop .det{margin:8px 0 0}
 
body{font-size:17px;line-height:1.47;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1{font-size:34px;font-weight:700;letter-spacing:-.022em;line-height:1.12}
h2{font-size:22px;font-weight:700;letter-spacing:-.015em}
h2 span{font-family:var(--f-body);font-weight:400;font-size:15px;letter-spacing:0}
.eyebrow{font-size:13px;letter-spacing:0}
.meta,.sub{font-size:15px}
.list,.tbl,.gantt-wrap,.gate,.alert{border:0;border-radius:14px}
.alert{background:var(--seal-soft)}
.alert .num{font-family:var(--f-body);font-weight:700}
.task,.g-row,.kv{border-color:var(--line)!important;border-top-width:.5px}
.kv:nth-child(even){border-left-width:.5px}
.task:has(input:checked){background:transparent}
.task:has(input:checked) strong{color:var(--muted)}
.task input[type=checkbox]{-webkit-appearance:none;appearance:none;width:22px;height:22px;margin:2px 0 0;border-radius:50%;border:1.5px solid var(--line-strong);background:transparent;display:grid;place-content:center;cursor:pointer;transition:background .15s,border-color .15s}
.task input[type=checkbox]::before{content:"";width:9px;height:5px;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.task input[type=checkbox]:checked{background:var(--net);border-color:var(--net)}
.task input[type=checkbox]:checked::before{opacity:1}
.task input[type=checkbox]:focus-visible{outline:3px solid var(--net-soft);outline-offset:2px}
.date{font-family:var(--f-body);font-size:13px}
.date b{font-weight:600;font-size:15px}
.body strong,.ttl strong,details.mat summary strong{font-weight:600;font-size:17px}
.body p{font-size:15px}
.tag{border-radius:6px;font-size:12px;font-weight:500;padding:2px 8px}
.bar{height:6px;border-radius:3px;background:var(--hint)}
.bar i{background:var(--okfill);border-radius:3px}
.progress .n{font-family:var(--f-body);font-variant-numeric:tabular-nums}

  /* 最緊急任務：依時程表找出最早要完成、還沒勾完的事項 */
  function todayTP(){ var now=new Date(); var tp=new Date(now.getTime()+(now.getTimezoneOffset()+480)*60000); return Date.UTC(tp.getFullYear(),tp.getMonth(),tp.getDate()); }
  function md(ms){ var d=new Date(ms); return (d.getUTCMonth()+1)+'/'+d.getUTCDate()+'（'+'日一二三四五六'.charAt(d.getUTCDay())+'）'; }
  var urgentTarget=null;
  function countdown(){
    var g=document.getElementById('gantt'), el=$('days'), txt=$('alertText'), box=$('alert'); if(!el||!txt) return;
    var today=todayTP(), best=null;
    if(g) [].slice.call(g.querySelectorAll('.g-row[data-ids]')).forEach(function(r){
      var ids=r.getAttribute('data-ids').split(','), cbs=ids.map(function(id){return document.getElementById(id)}).filter(Boolean);
      var left=cbs.filter(function(b){return !b.checked}); if(!cbs.length||!left.length) return;
      var bars=r.querySelectorAll('.g-bar'); if(!bars.length) return;
      var lb=bars[bars.length-1], due=gday(lb.getAttribute('data-e')||lb.getAttribute('data-s'));
      var dl=r.querySelector('.g-dl');
      if(!best||due<best.due) best={due:due,ids:ids,left:left,row:r,legal:dl?gday(dl.getAttribute('data-d')):null};
    });

    var d=Math.round((best.due-today)/864e5), isPrep=best.ids[0].charAt(0)==='p', title;
    if(isPrep) title='收齊準備材料';

    if(d>0) el.innerHTML=d+'<small>天</small>';

    urgentTarget={tab:isPrep?'prep':'todo', id:best.left[0].id};

  function gday(s){var p=s.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2])}
  var G0=gday('2026-10-15'), GN=Math.round((gday('2026-12-01')-G0)/864e5);
  function gpos(s){return (gday(s)-G0)/864e5/GN*100}
  function buildGantt(){
    var g=$('gantt'); if(!g) return;
    var ax=g.querySelector('.g-axis'), tracks=[].slice.call(g.querySelectorAll('.g-row .g-track'));
    for(var t=gday('2026-10-19');t<gday('2026-12-01');t+=7*864e5){
      var d=new Date(t), lab=(d.getUTCMonth()+1)+'/'+d.getUTCDate(), x=((t-G0)/864e5/GN*100)+'%';
      var k=document.createElement('span');k.className='g-tick';k.style.left=x;k.textContent=lab;ax.appendChild(k);
      tracks.forEach(function(tr){var l=document.createElement('span');l.className='g-grid';l.style.left=x;tr.insertBefore(l,tr.firstChild)});
    }
    [].slice.call(g.querySelectorAll('.g-bar')).forEach(function(b){
      var s=b.getAttribute('data-s'), e=b.getAttribute('data-e')||s;
      b.style.left=gpos(s)+'%'; b.style.width=((gday(e)-gday(s))/864e5+1)/GN*100+'%';
    });
    [].slice.call(g.querySelectorAll('.g-dl')).forEach(function(m){m.style.left=(gpos(m.getAttribute('data-d'))+50/GN)+'%'});
    var now=new Date(), tp=new Date(now.getTime()+(now.getTimezoneOffset()+480)*60000);
    var today=Date.UTC(tp.getFullYear(),tp.getMonth(),tp.getDate());
    var off=(today-G0)/864e5;
    if(off>=0&&off<GN){tracks.forEach(function(tr){var n=document.createElement('span');n.className='g-now';n.style.left=((off+.5)/GN*100)+'%';tr.appendChild(n)})}
  }
  function paintGantt(){

    var b=document.createElement('button'); b.type='button'; b.className='mini'; b.textContent='複製'; b.addEventListener('click',function(){copyText(text,b)}); w.appendChild(b);

  function setupTodoPages(){
    todoPages=[]; todoBtns=[];
    var secs=[].slice.call(document.querySelectorAll('#content section[data-tab="todo"]')); if(!secs.length) return;
    if(secs.length>1){
      todoPages=secs.filter(function(x){return x.querySelector('h2')});

      pw=p; state=r.state||{};
      mount(r.html); countdown(); render();
      $('gate').hidden=true; $('app').hidden=false; document.body.classList.remove('locked');
      clearInterval(timer); timer=setInterval(poll,30000);
    },function(e){
      $('go').disabled=false; $('err').textContent=msg(e);
      if(auto){ var o=load(); delete o.pw; store(o); }
    });
  }

  $('gate').addEventListener('submit',function(ev){
    ev.preventDefault();
    enter($('pw').value,false);
  });
  $('logout').addEventListener('click',function(){
    var keep=load().who; store(keep?{who:keep}:{}); clearSiteData(); clearInterval(timer); pw=''; state={}; viewPw=''; infoDetail=null; infoSt={};
    $('content').innerHTML=''; $('app').hidden=true; $('gate').hidden=false; document.body.classList.add('locked');
    $('pw').value=''; $('go').disabled=false; $('err').textContent='';
  });

  function markTheme(){ var p=window.__yzTheme?window.__yzTheme.get():'auto'; [].slice.call(document.querySelectorAll('.theme-sw button')).forEach(function(b){ var on=b.getAttribute('data-th')===p; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on?'true':'false'); }); }
  [].slice.call(document.querySelectorAll('.theme-sw button')).forEach(function(b){ b.addEventListener('click',function(){ if(window.__yzTheme) window.__yzTheme.set(b.getAttribute('data-th')); markTheme(); }); });
  markTheme();

  document.addEventListener('visibilitychange',function(){if(!document.hidden&&pw)poll()});
  var saved=load();
  if(saved.pw){enter(saved.pw,true)}
})();
</script>
<script>
 
(function(){
  function setup(box){
    if(!box||box.__lg) return; box.__lg=1;
    var ind=document.createElement('span'); ind.className='lg-ind'; ind.setAttribute('aria-hidden','true');
    box.insertBefore(ind,box.firstChild);
    function place(){
      var on=box.querySelector('button.on');
      if(!on||!on.offsetWidth){ ind.style.opacity='0'; return; }
      ind.style.opacity='1';
      ind.style.width=on.offsetWidth+'px'; ind.style.height=on.offsetHeight+'px';
      ind.style.setProperty('--x',on.offsetLeft+'px'); ind.style.setProperty('--y',on.offsetTop+'px');
      if(!ind.classList.contains('ready')) requestAnimationFrame(function(){ requestAnimationFrame(function(){ ind.classList.add('ready'); }); });
    }
    new MutationObserver(place).observe(box,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
    if(window.ResizeObserver) new ResizeObserver(place).observe(box);
    window.addEventListener('resize',place);
    function down(e){ if(e.target.closest&&e.target.closest('button')) ind.classList.add('press'); }
    function up(){ ind.classList.remove('press'); }
    box.addEventListener('pointerdown',down);
    ['pointerup','pointercancel','pointerleave'].forEach(function(n){ box.addEventListener(n,up); });
    place();
  }
  window.__lgSetup=setup;
  function init(){ setup(document.querySelector('.theme-sw')); setup(document.getElementById('tabs')); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
  setTimeout(init,500);
})();
</script>
